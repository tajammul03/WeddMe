<script>
function showSub(groupId, btn) {
    document.querySelectorAll('.main-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.sub-cats-area').forEach(area => area.classList.remove('active'));
    if(groupId !== 'all') document.getElementById('sub-' + groupId).classList.add('active');
    else filterVendors('all');
}
function filterVendors(subId, btn) {
    if(btn) { document.querySelectorAll('.sub-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); }
    document.querySelectorAll('.v-card').forEach(card => card.style.display = (subId === 'all' || card.dataset.sub === subId) ? 'flex' : 'none');
    
    // Auto-scroll to vendors section after filtering
    setTimeout(() => {
        const vendorsSection = document.getElementById('vendorsSection');
        if (vendorsSection) {
            const rect = vendorsSection.getBoundingClientRect();
            const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            const elementTop = rect.top + scrollTop;
            
            // Calculate offset based on device
            const isMobile = window.innerWidth <= 768;
            const offset = isMobile ? 200 : 150;
            
            // Smooth scroll to vendors section
            window.scrollTo({
                top: elementTop - offset,
                behavior: 'smooth'
            });
        }
    }, 100);
}

// Search function for vendors and categories
function searchVendors() {
    const searchInput = document.getElementById('searchInput');
    const searchTerm = searchInput.value.toLowerCase().trim();
    const clearBtn = document.getElementById('clearSearch');
    const searchResults = document.getElementById('searchResults');
    const allCards = document.querySelectorAll('.v-card');
    
    // Show/hide clear button
    clearBtn.style.display = searchTerm ? 'block' : 'none';
    
    if (searchTerm === '') {
        // Show all vendors when search is empty
        allCards.forEach(card => card.style.display = 'flex');
        searchResults.innerHTML = '';
        return;
    }
    
    let visibleCount = 0;
    
    allCards.forEach(card => {
        const vendorName = card.querySelector('h3').textContent.toLowerCase();
        const vendorDesc = card.querySelector('p').textContent.toLowerCase();
        const vendorLocation = card.querySelector('.location').textContent.toLowerCase();
        const vendorPrice = card.querySelector('.price').textContent.toLowerCase();
        
        // Check if search term matches vendor name, description, location, or price
        if (vendorName.includes(searchTerm) || 
            vendorDesc.includes(searchTerm) || 
            vendorLocation.includes(searchTerm) ||
            vendorPrice.includes(searchTerm)) {
            card.style.display = 'flex';
            visibleCount++;
        } else {
            card.style.display = 'none';
        }
    });
    
    // Update search results count
    if (visibleCount === 0) {
        searchResults.innerHTML = '❌ No vendors found. Try different keywords.';
        searchResults.style.color = '#d9534f';
    } else {
        searchResults.innerHTML = `✅ Found ${visibleCount} vendor${visibleCount > 1 ? 's' : ''}`;
        searchResults.style.color = '#5cb85c';
    }
}

// WhatsApp helper function - opens WhatsApp with custom message including WeddJunction branding
function contactVendor(vendorName, service) {
    const msg = `Hi, I found you on *WeddJunction Belagavi* website.

I'm interested in *${vendorName}* for ${service}.

Please share more details.`;
    const url = `https://wa.me/918618171099?text=${encodeURIComponent(msg)}`;
    window.open(url);
}
// Call helper function - opens phone dialer (Wix compatible)
function makeCall() {
    // Use window.open with _self for better Wix compatibility
    var phoneNumber = 'tel:8618171099';
    if (window.location.href.indexOf('wix.com') > -1 || window.location.href.indexOf('wixsite.com') > -1) {
        // In Wix, use window.open
        window.open(phoneNumber, '_self');
    } else {
        // Standalone HTML - direct navigation
        window.location.href = phoneNumber;
    }
}
function openModal(id) { 
    const modal = document.getElementById(id);
    
    // Store current scroll position
    const scrollY = window.scrollY || window.pageYOffset;
    
    // Prevent body scroll and freeze position
    document.body.style.overflow = 'hidden';
    document.body.style.position = 'fixed';
    document.body.style.top = `-${scrollY}px`;
    document.body.style.width = '100%';
    
    // Show modal
    modal.style.display = 'flex';
    modal.classList.add('active');
    
    // Force modal to not be scrolled
    modal.scrollTop = 0;
    
    // Reset modal content scroll to top
    const modalContent = modal.querySelector('.modal-content');
    if (modalContent) {
        modalContent.scrollTop = 0;
    }
    
    // Double-check after render
    requestAnimationFrame(() => {
        modal.scrollTop = 0;
        if (modalContent) {
            modalContent.scrollTop = 0;
        }
    });
}
function closeModal(id) { 
    const modal = document.getElementById(id);
    modal.style.display = 'none';
    modal.classList.remove('active');
    
    // Restore scroll position
    const scrollY = document.body.style.top;
    document.body.style.position = '';
    document.body.style.top = '';
    document.body.style.width = '';
    document.body.style.overflow = '';
    
    if (scrollY) {
        window.scrollTo(0, parseInt(scrollY || '0') * -1);
    }
}
function scrollToSection(sectionName) {
    const sections = {
        'vendors': 'vendorsSection',
        'about': 'aboutSection',
        'contact': 'contactSection'
    };
    const sectionId = sections[sectionName];
    if (sectionId) {
        const element = document.getElementById(sectionId);
        if (element) {
            // For mobile, use a very small offset or scroll directly to the element
            const isMobile = window.innerWidth <= 768;
            
            if (isMobile && (sectionName === 'contact' || sectionName === 'about')) {
                // For mobile contact and about sections, scroll with better offset
                const rect = element.getBoundingClientRect();
                const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
                const elementTop = rect.top + scrollTop;
                
                window.scrollTo({
                    top: elementTop - 80,
                    behavior: 'smooth'
                });
            } else {
                // Get the position relative to the document
                const rect = element.getBoundingClientRect();
                const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
                const elementTop = rect.top + scrollTop;
                
                // Calculate offset based on section and device
                let offset = isMobile ? 200 : 100;
                
                // Scroll with the offset
                window.scrollTo({
                    top: elementTop - offset,
                    behavior: 'smooth'
                });
            }
        }
    }
}
